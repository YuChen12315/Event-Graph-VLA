# ============================================================================
# Event-Graph 长距离记忆 —— Astribot 真机 42 维版本
#
# 与仿真版 perceptual-eventgraph-expert_v2.yaml 的区别只有数据维度与资产路径：
#   - state 42 维（腰 4 + 左臂 7 + 右臂 7 + 左手 12 + 右手 12）
#   - state_mean/std 按真机 A 文件夹（68 条 / 43,691 帧）的 raw state 统计
#   - PCA 资产单独一份（pca_512_realrobot.npz）
#   - grasp 计数改用左手关节闭合度（见下方 grasp_mode）
# 记忆结构、切分参数、expert 注入方式与仿真版完全一致。
#
# 容量 32 沿用 RoboMME Counting 的实测值。真机数据预计算后要重新量
# steps.npz 里 vis_ptr[t+1]-vis_ptr[t] 的最大并发节点数；若接近 32，把
# max_nodes 调大，并同步修改顶层 budget = max_nodes*16 + recent_window*16。
# ⚠️ 合并路径上有两个已知未修的 bug（event_id / boundary_strength），所以
#    不能让并发节点数触到容量上限。
#
# 真机没有平行夹爪的「宽度」这一维，grasp 计数改用左手 12 维关节的均值作
# 闭合度（grasp_mode: hand_closure）；所有任务都是左手抓取、右手不闭合。
# ============================================================================

budget: 640
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 42
    hidden_dim: 512
integration_type: expert
memory_token_dim: 1024
representation_type: perceptual

perceptual_memory:
  type: event_graph

  recent_window: 8
  max_nodes: 32
  event_len: 8
  event_dim: 512

  event_cache_dtype: fp16

  # 安静点切分（与 RoboMME 版一致）
  cut_block: 30
  cut_max_len: 50
  cut_smooth: 5
  min_event_len: 10

  # 抓取计数：左手 12 维关节（state[18:30]）均值作闭合度，滞回判闭合段。
  # 张开 ~0.14–0.18，闭合 ~0.55–0.83。A 文件夹（68 条）实测：0.40/0.30 时
  # 每条计数 0/1/2 次的分布为 1/21/46（均值 1.66）；把 open 降到 0.25 会有
  # 12 条从未触发，疑似两次抓取之间的半开没有越过门槛。
  grasp_mode: hand_closure
  hand_slice: [18, 30]
  hand_close_threshold: 0.40
  hand_open_threshold: 0.30

  # 42 维 raw state 的 mean/std（A: 68 条 / 43,691 帧）。
  # 来源：<dataset>/meta/state_stats.json（build_realrobot_dataset.py 生成）。
